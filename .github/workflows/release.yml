name: Release

# Triggers when you push a tag like: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
            blocking: true                  # release waits for this

          - os: macos-latest                # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            label: macos-arm
            blocking: true                  # release waits for this

          - os: macos-13                    # Intel Macs (older customers)
            target: x86_64-apple-darwin
            label: macos-intel
            blocking: false                 # may sit in GitHub queue for hours
                                            # — let the rest of the release ship

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Intel macOS runners on GitHub are often queue-starved.  Marking that
    # platform non-blocking lets Windows + macOS ARM publish promptly even
    # if Intel has to wait.  When Intel finishes (whenever that is), its
    # artifacts are appended to the same release and latest.json is updated.
    continue-on-error: ${{ !matrix.blocking }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: UI/src-tauri

      - name: Install frontend dependencies
        run: npm install
        working-directory: UI

      # Diagnostic — proves the signing secrets reached this step.
      # Tauri's `signer generate` writes the key as a SINGLE base64 line
      # (~190-400 chars), so we just sanity-check length and presence.
      - name: Verify signing secrets are present
        shell: bash
        env:
          KEY:  ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is EMPTY or NOT SET"
            exit 1
          fi
          if [ -z "$PASS" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is EMPTY or NOT SET"
            exit 1
          fi
          KEY_LEN=$(printf %s "$KEY" | wc -c)
          KEY_HEAD=$(printf %s "$KEY" | head -c 8)
          PASS_LEN=$(printf %s "$PASS" | wc -c)
          echo "[diag] KEY length=$KEY_LEN head='$KEY_HEAD...'"
          echo "[diag] PASS length=$PASS_LEN"
          if [ "$KEY_LEN" -lt 100 ]; then
            echo "::warning::KEY length=$KEY_LEN is suspiciously short — Tauri keys are usually 300-400 chars"
          fi

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                      ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY:         ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (optional — removes "unidentified developer" warning)
          # APPLE_CERTIFICATE:               ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD:      ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY:          ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID:                        ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD:                  ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID:                   ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: UI
          tagName: ${{ github.ref_name }}
          releaseName: Visara ${{ github.ref_name }}
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            See full changelog in the commit history.

            ### Download
            - **Windows**: `Visara_*_x64-setup.exe`
            - **macOS (Apple Silicon)**: `Visara_*_aarch64.dmg`
            - **macOS (Intel)**: `Visara_*_x64.dmg` *(may appear later — Intel runners can be queue-starved)*
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true            # publish latest.json for auto-updates
          updaterJsonPreferNsis: true         # use NSIS .nsis.zip (smaller) for Windows updates
          args: --target ${{ matrix.target }} --verbose

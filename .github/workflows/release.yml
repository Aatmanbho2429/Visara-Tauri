name: Release

# Triggers when you push a tag like: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows

          - os: macos-latest          # Apple Silicon (M1/M2/M3) — covers all current Macs
            target: aarch64-apple-darwin
            label: macos-arm

          # NOTE: macos-13 (Intel) is intentionally NOT in the matrix.
          # GitHub's Intel runners are heavily backlogged (jobs sit for hours).
          # All Macs sold since 2020 are Apple Silicon — Intel support adds
          # release latency for ~0% of new users.  Re-add if/when a customer
          # actually needs it.

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: UI/src-tauri

      - name: Install frontend dependencies
        run: npm install
        working-directory: UI

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                      ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY:         ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (optional — removes "unidentified developer" warning)
          # APPLE_CERTIFICATE:               ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD:      ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY:          ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID:                        ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD:                  ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID:                   ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: UI
          tagName: ${{ github.ref_name }}
          releaseName: Visara ${{ github.ref_name }}
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            See full changelog in the commit history.

            ### Download
            - **Windows**: `Visara_*_x64-setup.exe`
            - **macOS (Apple Silicon)**: `Visara_*_aarch64.dmg`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

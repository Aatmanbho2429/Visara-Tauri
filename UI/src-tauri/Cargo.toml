[package]
name         = "pictoria"
version      = "1.1.39"
description  = "Pictoria — AI-powered Visual Image Search"
authors      = ["Aatman Stridely"]
license      = "UNLICENSED"
edition      = "2021"
rust-version = "1.77.2"

[lib]
name       = "pictoria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pictoria"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]

# Desktop shell
tauri                 = { version = "2.11.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log      = "2"
tauri-plugin-dialog   = "2"
tauri-plugin-updater          = "2"
tauri-plugin-process          = "2"
tauri-plugin-global-shortcut  = "2"
tauri-plugin-notification     = "2"
tauri-plugin-autostart        = "2"

# Cross-platform clipboard reader — handles both bitmap data (screenshots,
# "Copy Image" from browsers) and file-list clipboards (Windows Explorer
# "Copy", macOS Finder "Copy").  More robust than the Tauri plugin.
clipboard-rs = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client — Supabase Edge Functions + the local sidecar (core::sidecar
# uses the blocking client since it's called from spawn_blocking closures
# alongside other synchronous CPU work, not from async command handlers)
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite — image metadata store
rusqlite = { version = "0.32", features = ["bundled"] }

# Image decoding — JPEG, PNG, TIFF, BMP, WebP, GIF
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "tiff", "bmp", "gif", "webp",
] }

# Direct TIFF IFD navigation (IFD1 thumbnail extraction)
tiff = "0.9"

# Fast file fingerprinting
sha2 = "0.10"
hex  = "0.4"

# Data-parallel batch image preprocessing
rayon = "1"

# Recursive directory walking
walkdir = "2"

# Cross-platform file-system watcher (Watch Folders feature)
notify = "6"

# Platform home / data directories
dirs = "5"

# Error handling
thiserror = "2"
anyhow    = "1"

# Thread-safe lazy statics
once_cell = "1"

# Structured logging
log = "0.4"

# OS keychain (macOS Keychain / Windows Credential Manager) for the auth
# token. Falls back to the existing plaintext file on platforms/setups where
# no OS credential store is available (see services/auth.rs).
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Compile-time string obfuscation for sensitive literals (device-fingerprint
# shell commands, etc.) so they don't show up verbatim in `strings <binary>`.
obfstr = "0.4"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true

# Measurement-only profile (SEARCH-LATENCY-PLAN.md Phase 0) — `release`
# optimizes for size, which suppresses vectorization in the near_family
# numeric loop, so its timings can't be trusted for the Rust hot-path
# question Phase 0 exists to answer. Build with `--profile release-perf` to
# compare against plain `release`; not the shipping profile.
[profile.release-perf]
inherits  = "release"
opt-level = 3

<div class="app-shell">

  <!-- Floating nav pill -->
  <nav class="nav-pill">

    <div class="nav-pill__logo">
      <img src="assets/logo.svg" alt="Visara" class="nav-pill__logo-img" />
    </div>

    <div class="nav-pill__sep"></div>

    <a routerLink="search" routerLinkActive="nav-item--active" class="nav-item">
      <i class="pi pi-search"></i>
      <span class="nav-item__tip">{{ 'nav.search' | translate }}</span>
    </a>

    <a routerLink="profile" routerLinkActive="nav-item--active" class="nav-item">
      <i class="pi pi-user"></i>
      <span class="nav-item__tip">{{ 'nav.profile' | translate }}</span>
    </a>

    <div class="nav-pill__sep"></div>

    <button class="nav-item nav-item--logout" (click)="logout()">
      <i class="pi pi-sign-out"></i>
      <span class="nav-item__tip">{{ 'nav.signOut' | translate }}</span>
    </button>

  </nav>

  <main class="shell-main">
    <router-outlet />
  </main>

</div>

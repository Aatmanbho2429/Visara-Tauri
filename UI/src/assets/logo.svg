<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="armL" x1="12" y1="16" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e879f9"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="armR" x1="88" y1="16" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e879f9"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left arm of V -->
  <line x1="12" y1="16" x2="50" y2="80"
        stroke="url(#armL)" stroke-width="13" stroke-linecap="round"
        filter="url(#softglow)"/>

  <!-- Right arm of V -->
  <line x1="88" y1="16" x2="50" y2="80"
        stroke="url(#armR)" stroke-width="13" stroke-linecap="round"
        filter="url(#softglow)"/>

  <!-- Pulse rings at the scan point -->
  <circle cx="50" cy="80" r="16" stroke="#e879f9" stroke-width="1"   opacity="0.15"/>
  <circle cx="50" cy="80" r="11" stroke="#f472b6" stroke-width="1.2" opacity="0.28"/>
  <circle cx="50" cy="80" r="6.5" stroke="#fb923c" stroke-width="1.5" opacity="0.5"/>

  <!-- Core dot -->
  <circle cx="50" cy="80" r="4" fill="url(#dot)" filter="url(#glow)"/>
</svg>
